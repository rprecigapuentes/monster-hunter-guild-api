image: node:24

variables:
  GIT_DEPTH: "0"
  NODE_ENV: test
  MYSQL_DATABASE: monster_hunter_guild
  MYSQL_ROOT_PASSWORD: root
  MYSQL_ROOT_HOST: "%"
  DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
  DATABASE_USER: root
  DATABASE_PASSWORD: root
  DATABASE_NAME: monster_hunter_guild
  DATABASE_HOST: mysql
  DATABASE_PORT: "3306"

services:
  - name: mysql:8.4
    command:
      - "--lower-case-table-names=1"

stages:
  - install
  - build
  - check
  - analysis
  - release
  - docker_build
  - docker_publish

cache:
  paths:
    - node_modules/

install_dependencies:
  stage: install
  script:
    - npm install --no-audit --no-fund
  artifacts:
    paths:
      - node_modules/
    expire_in: 1h

prisma:
  stage: build
  needs: [install_dependencies]
  script:
    - npm run prisma:migrate
    - npm run prisma:generate
  artifacts:
    paths:
      - src/generated

build:
  stage: build
  needs: [prisma]
  script:
    - npm run build

lint:
  stage: check
  needs: [build]
  script:
    - npm run lint

format_check:
  stage: check
  needs: [build]
  script:
    - npm run format:check

test:
  stage: check
  needs: [build, prisma]
  script:
    - apt-get update && apt-get install -y default-mysql-client
    - until mysqladmin ping -h mysql -u root -proot --silent; do echo "Waiting for MySQL..."; sleep 2; done
    - npm run test:ci --silent
  artifacts:
    paths:
      - coverage/

sonarqube_check:
  stage: analysis
  image: sonarsource/sonar-scanner-cli:5.0.1
  needs: [test]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - sonar-scanner
      -Dsonar.host.url="$SONAR_HOST_URL"
      -Dsonar.token="$SONAR_TOKEN"
      -Dsonar.qualitygate.wait=true

release:
  stage: release

  needs: [install_dependencies, lint, format_check, test]

  script:
    - npm run release
    - git status
    - git log -1 --oneline
    - git tag --points-at HEAD
    - |
      if git describe --tags --exact-match HEAD > /dev/null 2>&1; then
        echo "VERSION=$(node -p "require('./package.json').version")" > version.env
      else
        echo "No new version released, skipping image build/publish."
        touch version.env
      fi

  artifacts:
    reports:
      dotenv: version.env

  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'

docker_build:
  stage: docker_build

  image: docker:24.0.5-cli

  services:
    - docker:24.0.5-dind

  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"

  needs:
    - job: release
      artifacts: true

  script:
    - |
      if [ -z "$VERSION" ]; then
        echo "No new version to build, skipping."
        touch image.tar
        exit 0
      fi
    - export IMAGE_TAG="$CI_REGISTRY_IMAGE:v$VERSION"
    - docker build -t "$IMAGE_TAG" .
    - docker save "$IMAGE_TAG" -o image.tar

  artifacts:
    paths:
      - image.tar
    expire_in: 1 hour

  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'

docker_publish:
  stage: docker_publish

  image: docker:24.0.5-cli

  services:
    - docker:24.0.5-dind

  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"

  needs:
    - job: release
      artifacts: true
    - job: docker_build
      artifacts: true

  script:
    - |
      if [ -z "$VERSION" ]; then
        echo "No new version to publish, skipping."
        exit 0
      fi
    - export IMAGE_TAG="$CI_REGISTRY_IMAGE:v$VERSION"
    - docker load -i image.tar
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
    - docker push "$IMAGE_TAG"

  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
